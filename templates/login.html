<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Iniciar Sesión - Bendecida Desing</title>
  
  <!-- Tipografía Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,600;0,700;1,600&family=Outfit:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  
  <!-- Estilos del Sistema -->
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
  <style>
    .login-wrapper {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 1.5rem;
    }
    .login-card {
      max-width: 420px;
      width: 100%;
      background: #ffffff;
      border: 1px solid var(--border-subtle);
      border-radius: var(--radius-lg);
      padding: 2.25rem 2rem;
      box-shadow: var(--shadow-md);
      text-align: center;
      position: relative;
    }
    .login-logo-frame {
      width: 90px;
      height: 90px;
      border-radius: 50%;
      overflow: hidden;
      border: 3px solid var(--gold);
      box-shadow: 0 4px 18px var(--primary-glow);
      margin: 0 auto 1.25rem;
      background: #fff;
    }
    .login-logo-frame img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }
    .login-title {
      font-family: var(--font-brand);
      font-size: 1.85rem;
      background: linear-gradient(135deg, #b23a60 0%, #cfa236 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      margin-bottom: 0.25rem;
    }
    .login-subtitle {
      color: var(--text-muted);
      font-size: 0.88rem;
      margin-bottom: 1.75rem;
    }
    .login-form {
      text-align: left;
      display: flex;
      flex-direction: column;
      gap: 1.15rem;
    }
    .login-alert {
      background: rgba(225, 29, 72, 0.08);
      border: 1px solid rgba(225, 29, 72, 0.25);
      color: var(--accent-rose);
      padding: 0.65rem 0.9rem;
      border-radius: var(--radius-sm);
      font-size: 0.85rem;
      margin-bottom: 1rem;
      text-align: center;
      font-weight: 600;
    }
    .credentials-hint {
      margin-top: 1.5rem;
      padding-top: 1.25rem;
      border-top: 1px dashed var(--border-subtle);
      font-size: 0.82rem;
      color: var(--text-muted);
      background: #fff8fa;
      border-radius: var(--radius-sm);
      padding: 0.75rem;
    }
  </style>
</head>
<body>

  <div class="login-wrapper">
    <div class="login-card">
      
      <!-- Logo Oficial -->
      <div class="login-logo-frame">
        <img src="{{ url_for('static', filename='img/logo_bendecida.png') }}" alt="Bendecida Desing">
      </div>

      <h2 class="login-title">Bendecida Desing</h2>
      <p class="login-subtitle">Sistema de Control de Inventario & Ventas</p>

      {% if error %}
        <div class="login-alert">
          ⚠️ {{ error }}
        </div>
      {% endif %}

      <form method="POST" action="{{ url_for('login') }}" class="login-form">
        <div class="form-group">
          <label for="username">Usuario:</label>
          <div style="display: flex; gap: 0.5rem;">
            <input 
              type="text" 
              id="username" 
              name="username" 
              class="form-control" 
              placeholder="admin o vendedor" 
              value="admin"
              required 
              autofocus
              style="flex: 1;"
            >
            {% if usuarios %}
            <select class="form-select" style="max-width: 130px; font-size: 0.8rem;" onchange="document.getElementById('username').value = this.value">
              <option value="">Elegir...</option>
              {% for u in usuarios %}
                <option value="{{ u.username }}">{{ u.username }} ({{ u.rol }})</option>
              {% endfor %}
            </select>
            {% endif %}
          </div>
        </div>

        <div class="form-group">
          <label for="password">Contraseña de Acceso:</label>
          <div style="position: relative;">
            <input 
              type="password" 
              id="password" 
              name="password" 
              class="form-control" 
              placeholder="Ingrese su contraseña..." 
              required
              style="padding-right: 2.75rem;"
            >
            <button 
              type="button" 
              onclick="togglePassword()" 
              style="position: absolute; right: 0.65rem; top: 50%; transform: translateY(-50%); background: none; border: none; cursor: pointer; font-size: 1.1rem; color: var(--text-muted); padding: 0.25rem;"
              title="Mostrar u ocultar contraseña"
            >
              👁️
            </button>
          </div>
        </div>

        <button type="submit" class="btn btn-primary" style="width: 100%; padding: 0.85rem; font-size: 1.05rem; margin-top: 0.5rem; font-weight: bold; border-radius: var(--radius-md); box-shadow: var(--shadow-md);">
          🔐 Iniciar Sesión
        </button>
      </form>

      <!-- Ayuda de usuarios del sistema -->
      <div class="credentials-hint" style="text-align: left;">
        <strong style="color: var(--primary-dark); display: block; margin-bottom: 0.35rem;">👥 Usuarios disponibles:</strong>
        <div style="display: flex; justify-content: space-between; font-size: 0.8rem; margin-bottom: 0.2rem;">
          <span>• <strong>admin</strong> (Acceso total & autorizaciones)</span>
          <span style="color: var(--text-muted); font-family: monospace;">bendecida2026</span>
        </div>
        <div style="display: flex; justify-content: space-between; font-size: 0.8rem;">
          <span>• <strong>vendedor</strong> (POS & Caja)</span>
          <span style="color: var(--text-muted); font-family: monospace;">1234</span>
        </div>
      </div>

    </div>
  </div>

  <script>
    function togglePassword() {
      const input = document.getElementById('password');
      if (input.type === 'password') {
        input.type = 'text';
      } else {
        input.type = 'password';
      }
    }
  </script>
</body>
</html>
